audio:
  chunk_size: 131584
  dim_f: 1024
  dim_t: 256
  hop_length: 512
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.001 # Other values: 0.000

model:
  dim: 384
  depth: 6
  stereo: True
  num_stems: 1
  time_transformer_depth: 1
  freq_transformer_depth: 1
  num_bands: 60
  dim_head: 64
  heads: 8
  attn_dropout: 0
  ff_dropout: 0
  flash_attn: True
  dim_freqs_in: 1025
  sample_rate: 44100
  stft_hop_length: 441
  stft_win_length: 2048
  stft_normalized: False
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
    - 4096
    - 2048
    - 1024
    - 512
    - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: False

training:
  batch_size: 1 # Other values: 1, 7, 4
  gradient_accumulation_steps: 1 # Other values 8
  grad_clip: 0
  instruments:
    - vocals
    - other
  lr: 5.0e-05 # Other values: 1.0e-05 4.0e-05 1.0e-04
  patience: 2
  reduce_factor: 0.95
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: false #Other values: true
  ema_momentum: 0.999
  optimizer: adam
  other_fix: false
  use_amp: true

lora:
  r: 8 # Range: 4-32
  lora_alpha: 16 # alpha / rank > 1 Values: 16, 24, 32, 64
  lora_dropout: 0.05 # range: 0 - 0.1
  merge_weights: False
  fan_in_fan_out: False
  enable_lora: [True, False, True]

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs: !!python/tuple
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5
  all:
    channel_shuffle: 0.5
    random_inverse: 0.1
    random_polarity: 0.5

inference:
  num_overlap: 2 # Other values: 8 1
  chunk_size: 352800 # Other values: 705600 176400
